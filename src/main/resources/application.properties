server.port=8080

# 观测项目合法取值范围（超出即拒绝，原因 VALUE_OUT_OF_RANGE）
early-warning.ranges.HR.min=0
early-warning.ranges.HR.max=250
early-warning.ranges.SBP.min=30
early-warning.ranges.SBP.max=300
early-warning.ranges.SPO2.min=0
early-warning.ranges.SPO2.max=100
early-warning.ranges.RR.min=0
early-warning.ranges.RR.max=80
early-warning.ranges.TEMP.min=25
early-warning.ranges.TEMP.max=45
early-warning.ranges.LACTATE.min=0
early-warning.ranges.LACTATE.max=30
early-warning.ranges.WBC.min=0
early-warning.ranges.WBC.max=500

# 时间戳允许超前当前时间的上限
early-warning.max-future-skew=PT5M
# 允许入库的历史数据最大年龄（之内的迟到数据正常参与判定）
early-warning.max-past-age=P30D
