server.port=8080
spring.application.name=clinical-early-warning

# 观测时间允许领先接收时钟的上限（超过按 INVALID_TIMESTAMP 拒绝）
clinical-warning.max-timestamp-future=PT5M
# 观测时间允许回溯的历史跨度（超过按 INVALID_TIMESTAMP 拒绝）
clinical-warning.max-timestamp-age=P30D
# 风险判定纳入的观测窗口：每指标取窗口内最新值
clinical-warning.lookback=PT24H

# 本地模拟上报开关：java -jar ... --clinical-warning.simulation.enabled=true
clinical-warning.simulation.enabled=false
clinical-warning.simulation.patient-count=3
clinical-warning.simulation.interval=PT10S
